<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The working software loop</title>
  <desc id="desc">Speech enters OpenAI Realtime over WebRTC; voice tools and diner taps enter the command boundary. Staff reports also enter the boundary, which persists versioned state in SQLite. Events wake the Responses planner. Typed proposals pass deterministic validation before becoming requested actions. The kitchen simulator acknowledges or fails those actions. Results return to shared state and reach React surfaces and voice context.</desc>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#A895AA" stroke-width="1.3"/></marker></defs>
  <rect width="1200" height="710" rx="24" fill="#231C29"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="49" fill="#EDC66D" font-size="14" font-weight="bold" letter-spacing="3">UNDER THE HOOD</text>
    <text x="44" y="95" fill="#FFF8EF" font-family="Georgia, serif" font-size="36">Real models. Enforced boundaries. A closed loop.</text>
    <g stroke="#A895AA" stroke-width="2" marker-end="url(#arr)">
      <path d="M350 191H416"/><path d="M596 244V283"/><path d="M854 191H778"/>
      <path d="M778 337H864"/><path d="M1008 388V446"/><path d="M864 497H778"/>
      <path d="M416 497H350"/><path d="M178 446V337H416"/>
      <path d="M695 456V398"/>
      <path d="M426 366H387V579H240V589"/>
    </g>
    <rect x="44" y="140" width="306" height="104" rx="14" fill="#392E41" stroke="#594862"/>
    <text x="66" y="174" fill="#F9F1E8" font-size="22" font-weight="bold">Mira · OpenAI Realtime</text>
    <text x="66" y="208" fill="#CEBFD2" font-size="18">WebRTC speech → UI tool calls</text>
    <rect x="426" y="140" width="352" height="104" rx="14" fill="#392E41" stroke="#594862"/>
    <text x="448" y="174" fill="#F9F1E8" font-size="22" font-weight="bold">Command boundary</text>
    <text x="448" y="208" fill="#CEBFD2" font-size="18">Voice tools · taps · staff commands</text>
    <rect x="864" y="140" width="292" height="104" rx="14" fill="#392E41" stroke="#594862"/>
    <text x="886" y="174" fill="#F9F1E8" font-size="22" font-weight="bold">Kitchen / coordinator</text>
    <text x="886" y="208" fill="#CEBFD2" font-size="18">Source-tagged facts + controls</text>
    <rect x="426" y="293" width="352" height="95" rx="14" fill="#EDC66D"/>
    <text x="448" y="331" fill="#30232B" font-size="23" font-weight="bold">Versioned state · SQLite</text>
    <text x="448" y="364" fill="#5F492F" font-size="18">Atomic commands + durable results</text>
    <rect x="864" y="293" width="292" height="95" rx="14" fill="#392E41" stroke="#594862"/>
    <text x="886" y="331" fill="#F9F1E8" font-size="22" font-weight="bold">DineOS · Responses</text>
    <text x="886" y="364" fill="#CEBFD2" font-size="18">Events wake the planning agent</text>
    <rect x="864" y="456" width="292" height="104" rx="14" fill="#392E41" stroke="#594862"/>
    <text x="886" y="491" fill="#F9F1E8" font-size="22" font-weight="bold">Typed proposal</text>
    <text x="886" y="525" fill="#CEBFD2" font-size="18">Sequence · alternative · question</text>
    <rect x="426" y="456" width="352" height="104" rx="14" fill="#30473F" stroke="#708E79"/>
    <text x="448" y="491" fill="#F0F5EA" font-size="22" font-weight="bold">Deterministic validation</text>
    <text x="448" y="525" fill="#C4D6CA" font-size="18">Feasibility · commitments · freshness</text>
    <rect x="44" y="456" width="306" height="104" rx="14" fill="#413931" stroke="#C6A471" stroke-dasharray="6 5"/>
    <text x="66" y="491" fill="#F9EAD5" font-size="22" font-weight="bold">Kitchen simulator</text>
    <text x="66" y="525" fill="#D9C6AA" font-size="18">Request → acknowledge / fail</text>
    <text x="56" y="365" fill="#CEBFD2" font-size="16">Recorded result</text>
    <text x="799" y="320" fill="#CEBFD2" font-size="14">event</text>
    <text x="709" y="429" fill="#CEBFD2" font-size="14">offers / questions</text>
    <rect x="44" y="591" width="372" height="77" rx="14" fill="#392E41" stroke="#594862"/>
    <text x="66" y="623" fill="#F9F1E8" font-size="20" font-weight="bold">Diner UI + kitchen UI + voice context</text>
    <text x="66" y="650" fill="#CEBFD2" font-size="17">Updated from accepted shared state</text>
    <text x="671" y="632" fill="#D9C6AA" font-size="17">Dashed boundary = simulated kitchen execution</text>
    <text x="671" y="660" fill="#AFA1B4" font-size="16">Only sequence / order actions enter kitchen execution.</text>
  </g>
</svg>
