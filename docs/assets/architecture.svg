<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Two AI roles. One shared view of service.</title>
  <desc id="desc">Mira's guest interaction, service team controls, and kitchen facts enter a shared command and state layer. Events wake the DineOS planning agent. Typed proposals are validated. Offers and questions return to state; kitchen actions go to the simulator. Acknowledgments or failures are recorded in state and reach the interfaces. Confirmed orders use the same guarded request and result path.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="724" gradientUnits="userSpaceOnUse"><stop stop-color="#241C2B"/><stop offset="1" stop-color="#302137"/></linearGradient>
    <linearGradient id="state" x1="44" y1="326" x2="1156" y2="436" gradientUnits="userSpaceOnUse"><stop stop-color="#F1D48D"/><stop offset="1" stop-color="#D9AC52"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto-start-reverse"><path d="M1 1L5.8 3.5L1 6" fill="none" stroke="#C1AFC7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="724" rx="24" fill="url(#canvas)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="48" fill="#ECCA7D" font-size="14" font-weight="bold" letter-spacing="3">IMPLEMENTED ARCHITECTURE</text>
    <text x="44" y="95" fill="#FFF8EF" font-family="Georgia, serif" font-size="38">Two AI roles. One shared view of service.</text>

    <rect x="44" y="137" width="344" height="132" rx="16" fill="#3B2E44" stroke="#65506F"/>
    <rect x="428" y="137" width="344" height="132" rx="16" fill="#332B3B" stroke="#57485F"/>
    <rect x="812" y="137" width="344" height="132" rx="16" fill="#332B3B" stroke="#57485F"/>
    <circle cx="76" cy="174" r="6" fill="#ECCA7D"/>
    <text x="94" y="181" fill="#FFF8EF" font-size="23" font-weight="bold">Guest experience · Mira</text>
    <text x="68" y="216" fill="#D3C5D8" font-size="19">React · OpenAI Realtime</text>
    <text x="68" y="245" fill="#B9A8C1" font-size="18">WebRTC voice + diner taps</text>
    <circle cx="460" cy="174" r="6" fill="#A4C9B7"/>
    <text x="478" y="181" fill="#FFF8EF" font-size="23" font-weight="bold">Service team</text>
    <text x="452" y="216" fill="#D3C5D8" font-size="19">Coordinator view + controls</text>
    <text x="452" y="245" fill="#B9A8C1" font-size="18">Pause · correct · override</text>
    <circle cx="844" cy="174" r="6" fill="#B9A8C1"/>
    <text x="862" y="181" fill="#FFF8EF" font-size="23" font-weight="bold">Kitchen facts</text>
    <text x="836" y="216" fill="#D3C5D8" font-size="19">Capacity · tickets · progress</text>
    <text x="836" y="245" fill="#D9BC88" font-size="18">Simulated inputs in this build</text>

    <g stroke="#C1AFC7" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M216 277V318" marker-start="url(#arrow)"/>
      <path d="M600 277V318" marker-start="url(#arrow)"/>
      <path d="M984 277V318"/>
    </g>

    <rect x="44" y="326" width="1112" height="110" rx="16" fill="url(#state)"/>
    <text x="70" y="369" fill="#30232B" font-size="29" font-weight="bold">Authoritative restaurant state</text>
    <text x="70" y="407" fill="#634C30" font-size="20">FastAPI · Pydantic · SQLite</text>
    <path d="M674 348V414" stroke="#AC843F" stroke-opacity=".5"/>
    <text x="704" y="369" fill="#4D392C" font-size="19">Versioned commands · exact consent</text>
    <text x="704" y="403" fill="#4D392C" font-size="19">Durable results · shared UI + voice context</text>

    <g stroke="#C1AFC7" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M168 437V497"/>
      <path d="M456 505V445"/>
      <path d="M1032 505V445"/>
      <path d="M293 570H323"/>
      <path d="M581 570H611"/>
      <path d="M869 570H899"/>
    </g>
    <text x="185" y="475" fill="#C5B5CD" font-size="16">events + context</text>
    <text x="473" y="475" fill="#C5B5CD" font-size="16">offers / questions</text>
    <text x="1049" y="475" fill="#C5B5CD" font-size="16">results</text>

    <rect x="44" y="506" width="248" height="128" rx="16" fill="#463049" stroke="#8D6289"/>
    <text x="65" y="533" fill="#E2B4D6" font-size="12" font-weight="bold" letter-spacing="2">01 / PLAN</text>
    <text x="65" y="567" fill="#FFF8EF" font-size="25" font-weight="bold">DineOS agent</text>
    <text x="65" y="596" fill="#DCC9DF" font-size="18">OpenAI Responses</text>
    <text x="65" y="620" fill="#BEA6C4" font-size="16">Produces a typed proposal</text>

    <rect x="332" y="506" width="248" height="128" rx="16" fill="#2E473F" stroke="#719884"/>
    <text x="353" y="533" fill="#A9D3BC" font-size="12" font-weight="bold" letter-spacing="2">02 / VALIDATE</text>
    <text x="353" y="567" fill="#F1F6ED" font-size="25" font-weight="bold">Policy checks</text>
    <text x="353" y="596" fill="#CBDECF" font-size="18">Feasibility · freshness</text>
    <text x="353" y="620" fill="#A7C2AF" font-size="16">Protect guest commitments</text>

    <rect x="620" y="506" width="248" height="128" rx="16" fill="#433A30" stroke="#D4AF6D" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="641" y="533" fill="#E9CA91" font-size="12" font-weight="bold" letter-spacing="2">03 / EXECUTE</text>
    <text x="641" y="567" fill="#FFF4DC" font-size="24" font-weight="bold">Kitchen simulator</text>
    <text x="641" y="596" fill="#E1CEAE" font-size="18">Sequence / order request</text>
    <text x="641" y="620" fill="#C3AB88" font-size="16">Replaceable execution layer</text>

    <rect x="908" y="506" width="248" height="128" rx="16" fill="#332B3B" stroke="#685772"/>
    <text x="929" y="533" fill="#CEBBD7" font-size="12" font-weight="bold" letter-spacing="2">04 / RECORD</text>
    <text x="929" y="567" fill="#FFF8EF" font-size="25" font-weight="bold">Action result</text>
    <text x="929" y="596" fill="#D3C5D8" font-size="18">Acknowledged or failed</text>
    <text x="929" y="620" fill="#B9A8C1" font-size="16">Persisted back to shared state</text>

    <text x="44" y="674" fill="#D5C6DB" font-size="17">Confirmed orders use the same guarded request / result path. Only acknowledged actions become active.</text>
    <path d="M44 698H70" stroke="#D4AF6D" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="80" y="703" fill="#AFA0B7" font-size="15">Dashed boundary: simulated kitchen execution today. Future adapters connect supported restaurant workflows.</text>
  </g>
</svg>
